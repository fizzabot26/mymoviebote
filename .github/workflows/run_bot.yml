name: 24h Movie Clips Bot Automation

on:
  schedule:
    # Yeh setting bot ka automatic timer hai (Har 24 ghante baad khud chalne ke liye)
    - cron: '0 0 * * *'
  workflow_dispatch: # Isse aap jab chahein khud bhi button daba kar bot chala sakti hain

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Free Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tools
        run: |
          pip install google-api-python-client requests

      - name: Run AI Video Bot
        run: python bot.py
