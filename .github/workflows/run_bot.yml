name: 24h Movie Clips Bot Automation

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Shorts Duration Options'
        required: true
        default: '1-1.30'
        type: choice
        options:
          - '5-30'
          - '30-1'
          - '1-1.30'
          - '1.30-2'
          - '2-3'
      category:
        description: 'Select Category / Type Mix'
        required: true
        default: 'mix'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Setup Python System Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Critical Requirements
      run: |
        pip install google-api-python-client

    - name: Run AI Movie Fetching Engine
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        BLOG_ID: ${{ secrets.BLOG_ID }}
      run: |
        python bot.py --duration "${{ github.event.inputs.duration }}" --query "${{ github.event.inputs.category }}"
