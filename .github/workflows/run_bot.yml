name: 24h Movie Clips Bot Automation

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Shorts Duration Selector'
        required: true
        default: '60'
      category:
        description: 'Category Live Search'
        required: false
        default: 'Movie Action Scenes'

jobs:
  run-bot:
    runs-size: ubuntu-latest
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Setup Python System Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Critical Requirements
      run: |
        pip install google-api-python-client huggingface_hub

    - name: Run AI Movie Fetching Engine
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        BLOG_ID: ${{ secrets.BLOG_ID }}
      run: |
        python bot.py --duration "${{ github.event.inputs.duration }}" --query "${{ github.event.inputs.category }}"
