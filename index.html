<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ultimate Production Panel</title>
    <style>
        :root { 
            --primary-red: #ff4757; 
            --accent-blue: #3742fa; 
            --bg-dark: #0a0a0d; 
            --card-bg: #13131a; 
            --input-bg: #252530; 
            --text-light: #f1f2f6; 
            --text-muted: #a4b0be; 
        }
        
        body { 
            background: var(--bg-dark); 
            color: var(--text-light); 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        /* 📱 SIDEBAR NAVIGATION */
        .sidebar-panel { 
            width: 290px; 
            background: var(--card-bg); 
            border-right: 2px solid #2f3542; 
            display: flex; 
            flex-direction: column; 
            padding: 20px 15px; 
            box-sizing: border-box; 
            justify-content: space-between; 
        }
        .sidebar-brand { 
            color: var(--primary-red); 
            font-size: 18px; 
            font-weight: bold; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            text-align: center; 
            margin-bottom: 25px; 
            border-bottom: 2px dashed #2f3542; 
            padding-bottom: 15px; 
        }
        .nav-btn { 
            background: transparent; 
            border: 1px solid #2f3542; 
            color: var(--text-light); 
            padding: 12px 15px; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 13px; 
            text-align: left; 
            cursor: pointer; 
            margin-bottom: 10px; 
            transition: 0.2s; 
            width: 100%; 
            text-transform: uppercase; 
        }
        .nav-btn:hover, .nav-btn.active { 
            background: var(--primary-red); 
            border-color: var(--primary-red); 
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3); 
        }
        
        /* 🌌 MAIN CONTENT SPACE */
        .main-content-window { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            overflow-y: auto; 
            box-sizing: border-box; 
        }
        .workspace-wrapper { 
            padding: 35px; 
            max-width: 1050px; 
            margin: 0 auto; 
            width: 100%; 
            box-sizing: border-box; 
        }
        .control-block-card { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 12px; 
            border: 1px solid #2f3542; 
            margin-bottom: 25px; 
            box-sizing: border-box; 
        }
        h2 { 
            color: var(--primary-red); 
            font-size: 14px; 
            text-transform: uppercase; 
            margin-top: 0; 
            margin-bottom: 20px; 
            border-left: 4px solid var(--primary-red); 
            padding-left: 10px; 
        }
        label { 
            font-weight: bold; 
            display: block; 
            margin-bottom: 10px; 
            color: var(--text-muted); 
            font-size: 12px; 
            text-transform: uppercase; 
        }
        
        .horizontal-filters-row { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        .horizontal-filters-row select, .horizontal-filters-row input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #4b5563; 
            background: var(--input-bg); 
            color: #fff; 
            font-size: 14px; 
            box-sizing: border-box; 
        }
        
        /* 🖱️ DRAG & DROP DESIGN */
        .drag-drop-zone-wrapper {
            border: 2px dashed #4b5563;
            background: var(--input-bg);
            border-radius: 10px;
            padding: 35px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.2s;
        }
        .drag-drop-zone-wrapper:hover, .drag-drop-zone-wrapper.dragover {
            border-color: var(--primary-red);
            background: rgba(255, 71, 87, 0.05);
        }
        
        /* 🎛️ CONTROLLERS & CONTROLS */
        .audio-sliders-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 15px;
        }
        .audio-slider-card input[type="range"] {
            width: 100%;
            accent-color: var(--primary-red);
            margin-top: 5px;
        }
        
        /* CLUSTER MATRIX DESIGN */
        .matrix-theme-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
            margin-bottom: 15px; 
        }
        .matrix-theme-item { 
            background: var(--input-bg); 
            padding: 14px; 
            border-radius: 8px; 
            text-align: center; 
            cursor: pointer; 
            border: 1px solid #4b5563; 
            font-size: 12px; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 5px; 
            color: var(--text-light);
            user-select: none;
        }
        .matrix-theme-item input { display: none; }
        .matrix-theme-item.selected { 
            background: var(--primary-red); 
            border-color: var(--primary-red); 
            color: #fff;
        }
        
        .music-player-row { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            background: var(--input-bg); 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #2f3542; 
            margin-top: 8px; 
        }
        .play-preview-btn { 
            background: var(--accent-blue); 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        .action-submit-btn { 
            width: 100%; 
            background: var(--primary-red); 
            color: white; 
            padding: 16px; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 15px; 
            cursor: pointer; 
            text-transform: uppercase; 
            margin-top: 15px; 
        }
        
        .app-view-panel { display: none; }
        .app-view-panel.active { display: block; }
        
        .conditional-form-block { display: none; margin-top: 15px; border-top: 1px dashed #2f3542; padding-top: 20px; }
        .conditional-form-block.revealed { display: block; }
    </style>
</head>
<body>

    <!-- 📱 SIDEBAR PANEL CONTAINER -->
    <div class="sidebar-panel">
        <div class="sidebar-top">
            <div class="sidebar-brand">⚙️ AI Studio Hub</div>
            <button class="nav-btn active" onclick="switchMainDashboardViewTab('shortsStudioTabWindow', this)">📱 Shorts Studio</button>
            <button class="nav-btn" onclick="switchMainDashboardViewTab('longVideoTabWindow', this)">🎞️ Long Video Studio</button>
            <button class="nav-btn" onclick="switchMainDashboardViewTab('pictureGridTabWindow', this)">📸 Picture AI Grid</button>
            <button class="nav-btn" onclick="switchMainDashboardViewTab('settingsPanelTabWindow', this)">🛠️ Hub Settings</button>
        </div>
        <div class="sidebar-footer-auth" style="border-top: 2px solid #2f3542; padding-top: 15px;">
            <button class="nav-btn" style="border-color: #2ed573; color: #2ed573;" onclick="alert('Secure Hardware Synced.')">👤 State: Active</button>
        </div>
    </div>

    <!-- 🌌 CENTRAL CANVAS MAIN PLATFORM -->
    <div class="main-content-window">
        <div class="workspace-wrapper">
            
            <!-- VIEW TAB 1: SHORTS ENGINE -->
            <div id="shortsStudioTabWindow" class="app-view-panel active">
                
                <!-- INPUT URL PIPELINE & HARDWARE ASSET DRAG AND DROP BOX -->
                <div class="control-block-card">
                    <h2>📥 Media Ingestion Data Pipeline</h2>
                    <div style="margin-bottom: 20px;">
                        <label>Source Multi-Platform Video Streaming URL Link:</label>
                        <input type="text" id="mediaSourcePipelineUrlLinkInput" style="width:100%; padding:12px; border-radius:8px; border:1px solid #4b5563; background:var(--input-bg); color:#fff;" placeholder="Paste YouTube, TikTok, Instagram, Snapchat or Bilibili URL stream here...">
                    </div>
                    
                    <label>Or Drop Local Source Files Directly:</label>
                    <div class="drag-drop-zone-wrapper" id="canvasDragDropInteractionZone" onclick="triggerSystemFileUploadSelectorGrid()">
                        <div style="font-size: 28px; margin-bottom: 8px;">📁</div>
                        <div id="uploadFeedbackLabelMessage" style="font-size: 13px; font-weight: bold;">
                            Drag & Drop Videos/Pictures Here OR Click to Browse Device Storage
                        </div>
                        <input type="file" id="hiddenNativeMediaAssetInputSlot" multiple style="display:none;" onchange="processSelectedMediaFilesMetadata(this)">
                    </div>
                </div>

                <!-- FILTERS SELECTION CONTROL MATRICES -->
                <div class="control-block-card">
                    <h2>📱 Target Timeline Matrix Filters</h2>
                    <div class="horizontal-filters-row">
                        <div>
