<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ultimate Production Panel</title>
    <style>
        :root { 
            --primary-red: #ff4757; 
            --accent-blue: #3742fa; 
            --bg-dark: #0a0a0d; 
            --card-bg: #13131a; 
            --input-bg: #252530; 
            --text-light: #f1f2f6; 
            --text-muted: #a4b0be; 
        }
        
        body { 
            background: var(--bg-dark); 
            color: var(--text-light); 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        /* 📱 SIDEBAR NAVIGATION ARCHITECTURE */
        .sidebar-panel { 
            width: 290px; 
            background: var(--card-bg); 
            border-right: 2px solid #2f3542; 
            display: flex; 
            flex-direction: column; 
            padding: 20px 15px; 
            box-sizing: border-box; 
            justify-content: space-between; 
        }
        .sidebar-brand { 
            color: var(--primary-red); 
            font-size: 18px; 
            font-weight: bold; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            text-align: center; 
            margin-bottom: 25px; 
            border-bottom: 2px dashed #2f3542; 
            padding-bottom: 15px; 
        }
        .nav-btn { 
            background: transparent; 
            border: 1px solid #2f3542; 
            color: var(--text-light); 
            padding: 12px 15px; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 13px; 
            text-align: left; 
            cursor: pointer; 
            margin-bottom: 10px; 
            transition: 0.2s; 
            width: 100%; 
            text-transform: uppercase; 
        }
        .nav-btn:hover, .nav-btn.active { 
            background: var(--primary-red); 
            border-color: var(--primary-red); 
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3); 
        }
        
        /* 🌌 CENTRAL CONTENT LAYER */
        .main-content-window { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            overflow-y: auto; 
            box-sizing: border-box; 
        }
        .workspace-wrapper { 
            padding: 35px; 
            max-width: 1050px; 
            margin: 0 auto; 
            width: 100%; 
            box-sizing: border-box; 
        }
        .control-block-card { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 12px; 
            border: 1px solid #2f3542; 
            margin-bottom: 25px; 
            box-sizing: border-box; 
        }
        h2 { 
            color: var(--primary-red); 
            font-size: 14px; 
            text-transform: uppercase; 
            margin-top: 0; 
            margin-bottom: 20px; 
            border-left: 4px solid var(--primary-red); 
            padding-left: 10px; 
        }
        label { 
            font-weight: bold; 
            display: block; 
            margin-bottom: 10px; 
            color: var(--text-muted); 
            font-size: 12px; 
            text-transform: uppercase; 
        }
        
        .horizontal-filters-row { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        .horizontal-filters-row select, .horizontal-filters-row input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #4b5563; 
            background: var(--input-bg); 
            color: #fff; 
            font-size: 14px; 
            box-sizing: border-box; 
        }
        
        /* 🖱️ DRAG & DROP PIPELINE BOX */
        .drag-drop-zone-wrapper {
            border: 2px dashed #4b5563;
            background: var(--input-bg);
            border-radius: 10px;
            padding: 35px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.2s;
        }
        .drag-drop-zone-wrapper:hover, .drag-drop-zone-wrapper.dragover {
            border-color: var(--primary-red);
            background: rgba(255, 71, 87, 0.05);
        }
        
        /* 🎛️ REAL-TIME CONTROLLER SLIDERS */
        .audio-sliders-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 15px;
        }
        .audio-slider-card {
            background: #1c1c24;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2f3542;
        }
        .audio-slider-card input[type="range"] {
            width: 100%;
            accent-color: var(--primary-red);
            margin-top: 5px;
        }
        
        /* 🎭 EXCLUSIVE MATRIX THEME MIXER GRID */
        .matrix-theme-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
            margin-bottom: 15px; 
        }
        .matrix-theme-item { 
            background: var(--input-bg); 
            padding: 14px; 
            border-radius: 8px; 
            text-align: center; 
            cursor: pointer; 
            border: 1px solid #4b5563; 
            font-size: 12px; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 5px; 
            color: var(--text-light);
            user-select: none;
            transition: 0.15s;
        }
        .matrix-theme-item input { display: none; }
        .matrix-theme-item.selected { 
            background: var(--primary-red); 
            border-color: var(--primary-red); 
            color: #fff;
        }
        
        .music-player-row { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            background: var(--input-bg); 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #2f3542; 
            margin-top: 8px; 
        }
        .play-preview-btn { 
            background: var(--accent-blue); 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        .action-submit-btn { 
            width: 100%; 
            background: var(--primary-red); 
            color: white; 
            padding: 16px; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 15px; 
            cursor: pointer; 
            text-transform: uppercase; 
            margin-top: 15px; 
        }
        
        .app-view-panel { display: none; }
        .app-view-panel.active { display: block; }
        
        .conditional-form-block { display: none; margin-top: 15px; border-top: 1px dashed #2f3542; padding-top: 20px; }
        .conditional-form-block.revealed { display: block; }
        
        .output-console-box { background: #000; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 12px; color: #2ed573; overflow-y: auto; max-height: 150px; border: 1px solid #2f3542; margin-top: 10px; }
        .ingest-row-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .ingest-row-item { display: flex; gap: 10px; align-items: center; background: #1b1b24; padding: 10px; border-radius: 8px; border: 1px solid #2f3542; }
    </style>
</head>
<body>

    <!-- 📱 SIDEBAR NAVIGATION PANEL -->
    <div class="sidebar-panel">
        <div class="sidebar-top">
            <div class="sidebar-brand">⚙️ AI Studio Hub</div>
            <button class="nav-btn active" id="btn-shorts" onclick="switchMainDashboardViewTab('shortsStudioTabWindow', this)">📱 Shorts Studio</button>
            <button class="nav-btn" id="btn-long" onclick="switchMainDashboardViewTab('longVideoTabWindow', this)">🎞️ Long Video Studio</button>
            <button class="nav-btn" id="btn-picture" onclick="switchMainDashboardViewTab('pictureGridTabWindow', this)">🖼️ Picture Enhancement</button>
        </div>
        <div style="font-size: 11px; text-align: center; color: var(--text-muted); border-top: 1px solid #2f3542; padding-top: 10px;">
            💎 100% Free Lifetime Tier Active
        </div>
    </div>

    <!-- 🌌 CENTRAL CONTENT LAYER -->
    <div class="main-content-window">
        <div class="workspace-wrapper">
            
            <!-- COUNTRY & REGION TARGET HUB -->
            <div class="control-block-card">
                <h2>🌍 Global Audience Target & Regional Psyche Mapping</h2>
                <div class="horizontal-filters-row" style="grid-template-columns: 1fr 1fr;">
                    <div>
                        <label>Select Target Country/Region:</label>
                        <select id="globalRegionFilterDropdown" onchange="synchronizeGlobalMarketIntelligenceNodes()">
                            <option value="USA" selected>USA (Friendly, Direct, Straightforward Vibe)</option>
                            <option value="Europe">Europe Hub (Serious, Confident, Dignified Stance)</option>
                            <option value="Germany">Germany Hub (Formal, High-Precision Logical Track)</option>
                            <option value="Canada">Canada Focus (Warm, Polite, High Retention)</option>
                        </select>
                    </div>
                    <div>
                        <label>AI Overall Suggestion, Verification & News Engine Status:</label>
