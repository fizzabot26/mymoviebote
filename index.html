<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Automation Hub - Master Control Panel</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary-accent: #ff4757;
            --secondary-accent: #3b82f6;
            --success-green: #22c55e;
            --danger-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-panel h1 {
            margin: 0;
            font-size: 24px;
            color: var(--primary-accent);
        }

        .section-block {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .section-block h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 18px;
            border-left: 4px solid var(--primary-accent);
            padding-left: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .form-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary-accent);
            outline: none;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--input-bg);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--secondary-accent);
        }

        .range-value {
            font-family: monospace;
            font-size: 13px;
            min-width: 45px;
            text-align: right;
            color: var(--secondary-accent);
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
        }

        .checkbox-row input {
            accent-color: var(--primary-accent);
            width: 16px;
            height: 16px;
        }

        .cluster-matrix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        .cluster-card {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .cluster-card.active-lock {
            border-color: var(--primary-accent);
            background: rgba(255, 71, 87, 0.05);
        }

        .music-track-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--input-bg);
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
        }

        .music-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .music-title {
            font-size: 14px;
            font-weight: 600;
        }

        .music-platform-tag {
            font-size: 11px;
            color: var(--success-green);
            font-family: monospace;
        }

        .btn {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary-accent);
            color: white;
            width: 100%;
            font-size: 16px;
            padding: 16px;
        }

        .btn-primary:hover {
            background: #ff6b81;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
        }

        .btn-audio {
            background: var(--secondary-accent);
            color: white;
            font-size: 12px;
            padding: 6px 14px;
        }

        .btn-audio.playing {
            background: var(--danger-red);
        }

        .btn-webgpu {
            background: #6c5ce7;
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .vault-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .vault-table th, .vault-table td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        .vault-table th {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
        }

        .status-badge {
            background: rgba(234, 179, 8, 0.1);
            color: #eab308;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .loss-prevention-banner {
            font-size: 12px;
            color: var(--success-green);
            text-align: center;
            font-family: monospace;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Header Panel Matrix -->
    <div class="header-panel">
        <div>
            <h1>AI Video Automation Hub</h1>
            <div class="loss-prevention-banner" id="saveStateIndicator">● Timeline State Saved (Anti-Loss Cache Engine Connected)</div>
        </div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <input type="text" id="userAccessEmail" placeholder="Admin Authorized Email" style="width: 220px;">
            <input type="text" id="botShieldToken" placeholder="Bot Protection Token Shield" style="width: 220px;">
        </div>
    </div>

    <!-- Media Ingest Module -->
    <div class="section-block">
        <h2>🔌 Media Stream Source Ingestion Pipeline</h2>
        <div class="form-grid-2" style="grid-template-columns: 2fr 1fr; margin-bottom: 15px;">
            <div class="field-group">
                <label>Source Pipeline Multi-Platform Streaming URL Link</label>
                <input type="text" id="sourceStreamUrl" placeholder="Paste YouTube, Facebook, TikTok, Instagram, Snapchat, or Bilibili URL...">
            </div>
            <div class="field-group">
                <label>Extraction Resolution Target Matrix</label>
                <select id="canvasResolution">
                    <option value="720">720p HD Render Path</option>
                    <option value="1080" selected>1080p Full HD Core Resolution (Standard)</option>
                    <option value="4k">4K Cinematic Un-watermarked Matrix</option>
                </select>
            </div>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="bloggerSyncToggle" checked>
            <label for="bloggerSyncToggle" style="color: var(--text-main); font-size:13px; cursor: pointer;">Enable Direct Blogger API Offload Connector (0% Native Storage Computing Overhead)</label>
        </div>
    </div>

    <!-- Output Duration Controls -->
    <div class="section-block">
        <h2>⏳ Target Timeline Multipliers Formats</h2>
        <div class="form-grid-3">
            <div class="field-group">
                <label>Operational Media Target Mode</label>
                <select id="operationModeToggle" onchange="adaptTimelineDurationDropdowns()">
                    <option value="shorts" selected>📱 Shorts Video Mode Allocations</option>
                    <option value="long">🎞️ Long Form Master Length Increments</option>
                </select>
            </div>
            <div class="field-group">
                <label>Duration Window Segment Limits</label>
                <select id="shortsDurationDropdown">
